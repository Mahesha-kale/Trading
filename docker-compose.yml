services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: trader
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    env_file: .env
    environment: ["HOST=0.0.0.0"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]

  # Overnight spot-grid live paper runner. Survives reboots: `restart:
  # unless-stopped` relaunches on crash or daemon restart, and grid_live.py
  # resumes bot state from the mounted reports/grid_live_series.jsonl (append
  # + per-tick flush -> no data loss mid-run). g/K follow the deployed grid in
  # reports/grid_bot.json; run_s here is the per-launch window.
  grid:
    build: .
    env_file: .env
    depends_on: [postgres]
    restart: unless-stopped
    volumes: ["./reports:/app/reports"]
    command: ["python", "scripts/grid_live.py", "B-BTC_USDT", "86400"]

volumes:
  pgdata: